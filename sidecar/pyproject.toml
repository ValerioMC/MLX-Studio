[project]
name = "mlxstudio-sidecar"
version = "0.4.0"
description = "MLX Studio backend: catalog, downloads, inference engine, OpenAI-compatible API."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "huggingface-hub>=0.24",
    "psutil>=6.0",
    "sse-starlette>=2.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Installed only on Apple Silicon; the server runs without it (engine falls back
# to an echo stub) so the rest of the app can be developed on any machine.
mlx = ["mlx-lm>=0.16"]
dev = ["pytest>=8.0", "ruff>=0.5", "pyinstaller>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mlxstudio"]

[tool.ruff]
line-length = 100
