name: Release latest

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-latest
  cancel-in-progress: true

jobs:
  # The same lint, typecheck and tests that gate pull requests; a failure here
  # stops the build, so nothing is published.
  checks:
    uses: ./.github/workflows/ci.yml

  build:
    name: Build apple-silicon
    needs: checks
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Python sidecar (PyInstaller)
        run: pnpm sidecar:build

      - name: Build Tauri app
        run: pnpm tauri:build

      - name: Rename DMG to a stable asset name
        run: |
          dmg="$(ls src-tauri/target/release/bundle/dmg/*.dmg)"
          mv "$dmg" "MLX-Studio_apple-silicon.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: dmg-apple-silicon
          path: MLX-Studio_apple-silicon.dmg
          if-no-files-found: error

  release:
    name: Publish "latest" release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Recreate the latest release with fresh assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(jq -r .version package.json)"
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest \
            --target "$GITHUB_SHA" \
            --title "MLX Studio $version (latest)" \
            --notes "Automated build of \`main\` @ $GITHUB_SHA.

          Requires a Mac with Apple Silicon (M1 and later): MLX-Studio_apple-silicon.dmg

          Unsigned build: macOS reports the downloaded app as damaged. After copying it to /Applications, clear the quarantine flag once:

          \`\`\`
          xattr -dr com.apple.quarantine \"/Applications/MLX Studio.app\"
          \`\`\`" \
            --latest \
            dist/*.dmg
